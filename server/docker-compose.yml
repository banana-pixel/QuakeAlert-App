# ============================================================================
# QuakeAlert — Local Dev Environment
# Target produksi: 1 vCPU / 1 GB VPS. mem_limit di sini mendekati batas produksi
# agar perilaku OOM/tekanan memori terlihat sejak dev (ADR-0001).
#
# Jalankan:  docker compose up -d
# Migrasi :  otomatis oleh service `migrate` (golang-migrate) setelah postgis
#            healthy. Sumber: contracts/db/migrations (contract-first, ADR-0004).
#            Rollback manual:
#              docker compose run --rm --entrypoint sh migrate \
#                -c 'migrate -path=/migrations -database "$DB_URL" down 1'
#
# CATATAN KEAMANAN: konfigurasi ini untuk DEV LOKAL.
#  - Mosquitto memakai plaintext 1883 + allow_anonymous HANYA untuk dev.
#    Di PRODUKSI WAJIB MQTTS 8883 + TLS + auth (ADR-0003); 1883 dilarang.
#  - Kredensial di bawah adalah default dev; JANGAN dipakai di produksi.
# ============================================================================

# DSN dev untuk golang-migrate. Didefinisikan sekali (anchor) lalu dipakai
# sebagai argumen -database dan sebagai env DB_URL untuk operasi manual.
x-migrate-dsn: &migrate_dsn "postgres://quakealert:${POSTGRES_PASSWORD:-devpassword}@postgis:5432/quakealert?sslmode=disable"

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: quakealert-postgis
    restart: unless-stopped
    mem_limit: 350m
    environment:
      POSTGRES_USER: quakealert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: quakealert
    command:
      - "postgres"
      - "-c"
      - "max_connections=20"
      - "-c"
      - "shared_buffers=96MB"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # :z untuk kompatibilitas SELinux (host Fedora/RHEL); tanpa efek di host lain.
      - ../contracts/db/migrations:/contracts-migrations:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quakealert -d quakealert"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Migrasi skema otomatis. Sekali jalan (restart: "no"): tunggu postgis healthy,
  # terapkan seluruh migrasi `up`, lalu exit 0. Idempoten — bila skema sudah
  # mutakhir golang-migrate keluar dengan "no change".
  migrate:
    image: migrate/migrate:v4.17.0
    container_name: quakealert-migrate
    restart: "no"
    mem_limit: 64m
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      DB_URL: *migrate_dsn
    volumes:
      - ../contracts/db/migrations:/migrations:ro,z
    command:
      - "-path=/migrations"
      - "-database"
      - *migrate_dsn
      - "up"

  redis:
    image: redis:7-alpine
    container_name: quakealert-redis
    restart: unless-stopped
    mem_limit: 64m
    command:
      - "redis-server"
      - "--maxmemory"
      - "48mb"
      - "--maxmemory-policy"
      - "noeviction"
      - "--save"
      - ""
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: quakealert-mosquitto
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "1883:1883"   # DEV plaintext only — DILARANG di produksi (pakai 8883/TLS)
      - "9001:9001"   # WebSocket (opsional, dev)
    volumes:
      - ../deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,z
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 -i healthcheck || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  mosquitto_data:
  mosquitto_log:
