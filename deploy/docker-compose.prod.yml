# =============================================================================
# QuakeAlert — PRODUKSI (VPS 1 vCPU / 1 GB, ADR-0001)
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Perbedaan pokok dari server/docker-compose.yml (dev):
#   - Hanya caddy (80/443) dan mosquitto (8883) yang terbuka ke internet.
#     Postgres, Redis, dan server aplikasi TIDAK punya `ports:` sama sekali —
#     mereka hanya dapat dijangkau lewat jaringan compose. Sebuah VPS dengan
#     5432 terbuka akan ditemukan pemindai dalam hitungan jam.
#   - TLS otomatis (ACME) oleh Caddy; sertifikat yang sama dipakai broker lewat
#     scripts/sync-mqtt-certs.sh.
#   - MQTT: 8883 + auth + ACL. Port 1883 tidak ada di file ini (ADR-0003).
#
# Semua secret dibaca dari .env.prod (lihat .env.prod.example). File itu TIDAK
# boleh masuk git.
# =============================================================================

x-migrate-dsn: &migrate_dsn "postgres://quakealert:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib}@postgis:5432/quakealert?sslmode=disable"

# Logging dibatasi di semua service: satu VPS 1 GB dengan disk kecil, dan log
# JSON tanpa batas adalah cara paling umum sebuah host penuh tanpa peringatan.
x-logging: &default_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # --- Reverse proxy: satu-satunya pintu HTTP(S) -----------------------------
  caddy:
    image: caddy:2-alpine
    container_name: quakealert-caddy
    restart: unless-stopped
    mem_limit: 96m
    logging: *default_logging
    ports:
      - "80:80"    # ACME HTTP-01 + redirect ke HTTPS
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN wajib (mis. api.quakealert.id)}
      MQTT_DOMAIN: ${MQTT_DOMAIN:?MQTT_DOMAIN wajib (mis. broker.quakealert.id)}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL wajib untuk peringatan kedaluwarsa}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro,z
      # caddy_data menyimpan kunci akun ACME dan sertifikat. HARUS persisten:
      # kehilangannya berarti menerbitkan ulang setiap restart, dan rate limit
      # Let's Encrypt (5 sertifikat identik/minggu) akan tercapai.
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      server:
        condition: service_started

  # --- Server aplikasi -------------------------------------------------------
  server:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-prod}
    image: quakealert-server:${VERSION:-prod}
    container_name: quakealert-server
    restart: unless-stopped
    mem_limit: 256m
    logging: *default_logging
    # Tanpa `ports:` — dijangkau caddy sebagai server:8080 di jaringan internal.
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://quakealert:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib}@postgis:5432/quakealert?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"

      # Koneksi server -> broker memakai TLS meski keduanya di host yang sama:
      # listener 8883 adalah satu-satunya yang ada, dan menyediakan listener
      # plaintext "hanya untuk internal" akan menjadi listener plaintext.
      MQTT_BROKER: "tls://${MQTT_DOMAIN}:8883"
      MQTT_USER: ${MQTT_SERVER_USER:-quakealert-server}
      MQTT_PASSWORD: ${MQTT_SERVER_PASSWORD:?MQTT_SERVER_PASSWORD wajib}
      MQTT_CLIENT_ID: quakealert-server

      # Yang dikembalikan ke firmware saat provisioning (bukan koneksi di atas).
      MQTT_PUBLIC_BROKER: ${MQTT_DOMAIN}
      MQTT_PUBLIC_PORT: "8883"
      MQTT_PUBLIC_TLS: "true"

      MASTER_KEY_HEX: ${MASTER_KEY_HEX:?MASTER_KEY_HEX wajib (64 hex char)}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib (>= 32 byte)}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-720}

      # Kunci operator untuk POST /api/v1/admin/*. Kosong = rute admin TIDAK
      # didaftarkan sama sekali (bukan terbuka), jadi tidak mengisinya aman.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}

      # Origin WebSocket: aplikasi Android tidak mengirim Origin, jadi daftar ini
      # hanya membatasi browser. Dibiarkan kosong = tolak semua lintas-origin.
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-}

      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:-}

      CONSENSUS_WINDOW_MS: ${CONSENSUS_WINDOW_MS:-8000}
      COOLDOWN_MS: ${COOLDOWN_MS:-90000}
      IO_TIMEOUT_MS: ${IO_TIMEOUT_MS:-2000}
    volumes:
      # Service account FCM, read-only. Path di dalam container harus sama dengan
      # FCM_CREDENTIALS_FILE di .env.prod.
      - ./secrets:/secrets:ro,z
    depends_on:
      postgis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started

  # --- PostGIS ---------------------------------------------------------------
  postgis:
    image: postgis/postgis:16-3.4
    container_name: quakealert-postgis
    restart: unless-stopped
    mem_limit: 350m
    logging: *default_logging
    environment:
      POSTGRES_USER: quakealert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: quakealert
    command:
      - "postgres"
      - "-c"
      - "max_connections=20"
      - "-c"
      - "shared_buffers=96MB"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quakealert -d quakealert"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Migrasi skema (sekali jalan, idempoten) -------------------------------
  migrate:
    image: migrate/migrate:v4.17.0
    container_name: quakealert-migrate
    restart: "no"
    mem_limit: 64m
    logging: *default_logging
    depends_on:
      postgis:
        condition: service_healthy
    volumes:
      - ../contracts/db/migrations:/migrations:ro,z
    command:
      - "-path=/migrations"
      - "-database"
      - *migrate_dsn
      - "up"

  # --- Redis (rate limiter reroll pseudonym) ---------------------------------
  redis:
    image: redis:7-alpine
    container_name: quakealert-redis
    restart: unless-stopped
    mem_limit: 64m
    logging: *default_logging
    command:
      - "redis-server"
      - "--maxmemory"
      - "48mb"
      - "--maxmemory-policy"
      - "noeviction"
      - "--save"
      - ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Mosquitto (MQTTS saja) ------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: quakealert-mosquitto
    restart: unless-stopped
    mem_limit: 96m
    logging: *default_logging
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/mosquitto.prod.conf:/mosquitto/config/mosquitto.conf:ro,z
      - ./mosquitto/aclfile:/mosquitto/config/aclfile:ro,z
      # passwd dibuat sekali dengan `mosquitto_passwd` (lihat scripts/init-mqtt-users.sh);
      # berisi hash, bukan password, tetapi tetap tidak boleh masuk git.
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro,z
      - ./mosquitto/certs:/mosquitto/certs:ro,z
      - mosquitto_data:/mosquitto/data
    healthcheck:
      # Memeriksa lewat TLS dengan kredensial monitor: healthcheck yang hanya
      # menguji port terbuka akan tetap hijau ketika sertifikat kedaluwarsa —
      # justru satu-satunya kegagalan yang paling mungkin terjadi di sini.
      test:
        - "CMD-SHELL"
        - >-
          mosquitto_sub -h ${MQTT_DOMAIN} -p 8883 --capath /etc/ssl/certs
          -u ${MQTT_MONITOR_USER:-quakealert-monitor} -P ${MQTT_MONITOR_PASSWORD:?MQTT_MONITOR_PASSWORD wajib}
          -t '$$SYS/broker/uptime' -C 1 -W 5 -i healthcheck >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  caddy_logs:
  mosquitto_data:
