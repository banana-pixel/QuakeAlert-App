# ============================================================================
# QuakeAlert — Mosquitto config (DEV LOKAL)
# PERINGATAN: file ini untuk pengembangan lokal saja.
#  - listener 1883 plaintext + allow_anonymous true HANYA untuk dev.
#  - Di PRODUKSI: WAJIB listener 8883 dengan TLS (cafile/certfile/keyfile),
#    allow_anonymous false, dan password_file / ACL. Plaintext 1883 DILARANG
#    (ADR-0003, .clinerules/30-firmware-esp32.md).
# ============================================================================

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# --- DEV listener: plaintext MQTT ---
listener 1883
allow_anonymous true

# --- DEV listener: MQTT over WebSocket (opsional) ---
listener 9001
protocol websockets
allow_anonymous true

# ----------------------------------------------------------------------------
# CONTOH KONFIG PRODUKSI (jangan diaktifkan di dev):
#
# listener 8883
# protocol mqtt
# cafile   /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
# require_certificate false
# tls_version tlsv1.2
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/aclfile
# ----------------------------------------------------------------------------
