# =============================================================================
# QuakeAlert — Mosquitto PRODUKSI (ADR-0003)
#
# Tiga hal yang membedakannya dari mosquitto.conf dev, dan ketiganya wajib:
#   1. Hanya listener 8883 (MQTTS). Port 1883 tidak dibuka sama sekali —
#      payload trigger membawa station_id dan HMAC-nya; di plaintext keduanya
#      dapat direkam lalu diputar ulang untuk memalsukan sebuah gempa.
#   2. allow_anonymous false. Tanpa ini siapa pun yang menemukan brokernya bisa
#      mem-publish ke sensor/<id>/trigger dan membangunkan seluruh pengguna.
#   3. ACL per-topik: node hanya boleh menulis, server hanya boleh membaca.
#      Kredensial node dibagi bersama di firmware, jadi node yang dibongkar
#      memberi penyerang tepat kemampuan sebuah node — bukan kemampuan server.
# =============================================================================

# per_listener_settings TIDAK dipakai: hanya ada satu listener di file ini, jadi
# pengaturan global sudah berlaku persis untuk listener itu — dan menyalakannya
# membuat mosquitto 2 memperingatkan tentang `allow_anonymous` di setiap start.

# --- MQTTS: firmware node + server ------------------------------------------
listener 8883
protocol mqtt

# Sertifikat diterbitkan Caddy via ACME dan disalin ke sini oleh
# scripts/sync-mqtt-certs.sh (Mosquitto tidak bisa berbicara ACME sendiri).
# certfile berisi rantai lengkap (leaf + intermediate) seperti yang ditulis
# Caddy; tanpa intermediate, mbedTLS di ESP32 menolak handshake-nya. `cafile`
# tidak di-set: ia hanya dipakai untuk memverifikasi sertifikat KLIEN, dan node
# diautentikasi dengan username/password (require_certificate false di bawah).
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key

# TLS 1.2 sebagai batas bawah: ESP32 (esp-tls/mbedTLS) mendukungnya, dan segala
# yang di bawahnya sudah rusak. TLS 1.3 dipakai otomatis bila kedua sisi bisa.
tls_version tlsv1.2

# require_certificate false: node diautentikasi dengan username/password, bukan
# sertifikat klien. Menanamkan sertifikat per node berarti mencabutnya per node
# juga — infrastruktur yang belum ada; lihat ADR-0003 untuk rencana mTLS.
require_certificate false

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/aclfile

# --- Batas sumber daya (VPS 1 vCPU / 1 GB, ADR-0001) ------------------------
# max_packet_size menutup jalur DoS termurah: payload trigger kontraknya ratusan
# byte, jadi apa pun di atas 4 KB bukan sensor. (Pengganti message_size_limit
# yang sudah deprecated di mosquitto 2.)
max_packet_size 4096
max_connections 500
max_queued_messages 200
max_inflight_messages 20

# QoS 1 dipakai untuk trigger, jadi pesan harus bertahan melewati restart broker
# — sebuah restart di tengah gempa tidak boleh memakan trigger yang belum
# di-ack.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
# `log_type information` sengaja dimatikan: setiap koneksi node akan mencatat
# satu baris, dan pada ratusan node itu memenuhi disk VPS lebih cepat daripada
# datanya sendiri.
connection_messages false
log_timestamp true
