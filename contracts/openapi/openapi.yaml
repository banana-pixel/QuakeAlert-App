openapi: 3.1.0
info:
  title: QuakeAlert REST API
  version: 1.0.0
  description: >
    Kontrak REST resmi QuakeAlert (contract-first, ADR-0004). Base URL selalu HTTPS.
    Satuan kanonik: PGA=gal (cm/s^2), timestamp=ms epoch UTC (int64), jarak=km, RSSI=dBm.
    Semua endpoint memerlukan Bearer JWT (anonymous) KECUALI:
    `GET /healthz` (probe publik), `POST /api/v1/auth/anonymous`
    (publik — bootstrap identitas) dan `GET /api/v1/events`
    (auth opsional; bila token dikirim ia wajib valid).
    Empat endpoint berikut adalah permukaan integrasi resmi klien Android
    (alur first-launch → lokasi → push → riwayat); panduan integrasi ada di
    docs/CLIENT_SPEC.md: `POST /api/v1/auth/anonymous`,
    `PUT /api/v1/users/location`, `PUT /api/v1/users/fcm-token`,
    `GET /api/v1/events`. Endpoint lainnya dipakai firmware (provisioning) dan
    tooling web (sensors, reroll pseudonym).
servers:
  - url: https://api.quakealert.id
    description: Produksi
  - url: http://localhost:8080
    description: Dev lokal (docker-compose)

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Bootstrap identitas anonim (JWT HS256)
  - name: nodes
    description: Provisioning & manajemen sensor node
  - name: sensors
    description: Status & peta sensor
  - name: users
    description: Profil pengguna anonim
  - name: events
    description: Riwayat kejadian gempa terkonfirmasi
  - name: chat
    description: Kanal komunitas (global & regional), lihat docs/CHAT_DESIGN.md
  - name: broadcasts
    description: Pengumuman operator (dibaca pengguna, ditulis pemegang kunci admin)
  - name: ops
    description: Health probe & kanal realtime (WebSocket)

paths:
  /healthz:
    get:
      tags: [ops]
      summary: Health probe (publik, tanpa prefix versi)
      description: >
        Probe kesehatan untuk load balancer / k8s dan badge koneksi di aplikasi.
        Publik dan sengaja berada di luar /api/v1. Kontrak berlapis:

        - **Status code** adalah kontrak pertama (tanpa parser): `200` selama
          dependensi kritikal hidup, `503` begitu database turun.

        - **Body JSON** membedakan "mati" dari "terbatas": `database: "down"`
          menjatuhkan status code; `mqtt: "down"` tidak (alert yang sudah
          terdispatch tetap sampai, hanya ingest bacaan baru yang berhenti).
          Dependensi yang belum diprobe dilaporkan `"unknown"` dan dihilangkan
          dari JSON bila tidak ada probe terpasang.

        Setiap pengecekan dependensi dibatasi 500 ms agar probe yang menggantung
        tidak menahan slot reverse proxy.
      operationId: healthz
      security: []
      responses:
        '200':
          description: >
            Proses hidup; dependensi non-kritikal boleh down (lihat body).
          content:
            application/json:
              schema:
                type: object
                required: [status, database]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  database:
                    type: string
                    description: Kritikal — "down" menjawab 503.
                    example: ok
                  mqtt:
                    type: string
                    description: >
                      Non-kritikal bagi status code. Absen bila probe broker
                      belum terpasang; "unknown" bila terpasang namun belum
                      bisa menilai.
                    enum: [ok, down, unknown]
              examples:
                allOk:
                  value:
                    status: ok
                    database: ok
                    mqtt: ok
                mqttDown:
                  value:
                    status: degraded
                    database: ok
                    mqtt: down
        '503':
          description: Dependensi kritikal (database) tidak hidup.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: degraded
                  database:
                    type: string
                    example: down
                  mqtt:
                    type: string
  /ws:
    get:
      tags: [ops]
      summary: Kanal realtime alert & chat (WebSocket upgrade)
      description: >
        Meng-upgrade koneksi ke WebSocket dan mengirim frame alert yang sama
        dengan payload FCM (contracts/fcm/alert_payload.json): EARTHQUAKE_ALERT,
        EARTHQUAKE_ADVISORY dan EVENT_RESOLVED. Jalur foreground; FCM menangani
        background. Server mengirim ping berkala dan menutup koneksi bila pong
        tidak diterima — klien wajib menjawab (OkHttp melakukannya sendiri).


        Auth memakai Bearer JWT yang sama, dikirim pada header handshake HTTP.
        Origin: hanya permintaan browser (yang mengirim header `Origin`) diperiksa
        terhadap WS_ALLOWED_ORIGINS; klien native tidak mengirim Origin dan
        diizinkan tanpa konfigurasi tambahan.


        Socket yang sama juga memfanout frame chat
        (`{"type":"CHAT_MESSAGE", ...}`, bentuknya sama dengan skema ChatMessage
        dengan `timestamp` ms-epoch menggantikan `created_at`), hanya untuk kanal
        yang menjadi keanggotaan koneksi — dibaca sekali saat handshake. Alert
        selalu diprioritaskan: bila buffer per-klien menipis, frame chat
        dilewati dan koneksi TIDAK ditutup, karena pesan chat yang hilang muncul
        kembali lewat GET /api/v1/chat/messages sedangkan peringatan yang hilang
        tidak punya jalan kembali. Frame yang DIKIRIM klien tetap diabaikan:
        pengiriman chat lewat REST.


        Didokumentasikan untuk kelengkapan — OpenAPI tidak memodelkan frame
        WebSocket, jadi skema pesan tetap di contracts/fcm/alert_payload.json.
      operationId: wsAlerts
      security:
        - bearerAuth: []
      parameters:
        - name: Upgrade
          in: header
          required: true
          schema:
            type: string
            const: websocket
      responses:
        '101':
          description: Switching Protocols — koneksi menjadi WebSocket
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            Origin browser tidak ada dalam WS_ALLOWED_ORIGINS. Tidak pernah
            terjadi pada klien tanpa header Origin.

  /api/v1/auth/anonymous:
    post:
      tags: [auth]
      summary: Terbitkan profil anonim + JWT (publik)
      description: >
        Membuat baris user_profiles baru (user_id UUID + pseudonym acak) dan
        menerbitkan JWT HS256 dengan klaim standar `sub`/`iat`/`exp`.
        Endpoint ini SATU-SATUNYA yang tidak memerlukan Bearer token — klien
        memanggilnya sekali saat first launch lalu menyimpan token secara lokal.
      operationId: authAnonymous
      x-client: true # dipakai klien Android saat first-launch (docs/CLIENT_SPEC.md)
      security: []
      responses:
        '201':
          description: Profil & token berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonymousAuthResponse'
        '429':
          description: >
            Rate limit per-IP: satu pembuatan profil anonim per 30 detik
            (internal/api: authWindow). IP adalah satu-satunya kunci yang
            tersedia pada endpoint publik tanpa identitas. Mudah tersentuh saat
            pengembangan — emulator, CI dan perangkat di belakang satu NAT
            berbagi IP — jadi klien harus menahan token yang sudah ada dan tidak
            memanggil ulang di setiap start.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: RATE_LIMITED
                message: terlalu banyak pendaftaran, coba lagi nanti
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/nodes/provision:
    post:
      tags: [nodes]
      summary: Inisiasi sensor baru (provisioning)
      description: >
        Membuat station_id baru dan provisioning_secret (ditampilkan HANYA sekali).
        Server menyimpan secret dalam bentuk terenkripsi AES-256-GCM (secret_key_enc + nonce).
      operationId: provisionNode
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionRequest'
      responses:
        '201':
          description: Node berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: >
            station_id yang dikirim sudah terdaftar (unique violation pada
            iot_nodes.station_id). Node yang sudah pernah di-provision harus
            memakai secret yang tersimpan di NVS-nya, bukan meminta yang baru.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: STATION_ALREADY_EXISTS
                message: station_id sudah terdaftar
        '429':
          description: >
            Batas laju provisioning: ~5x per jam per akun (cooldown 12 menit)
            dan 20x per jam per IP (cooldown 3 menit). Node baru lahir dengan
            `verified = false` (migrasi 000005) — heartbeat-nya diterima, tetapi
            trigger-nya ditolak sampai operator mengonfirmasi lewat
            `/api/v1/admin/nodes/{id}/verify`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: RATE_LIMITED
                message: provisioning dibatasi 5x per jam per akun

  /api/v1/nodes/revoke:
    post:
      tags: [nodes]
      summary: Batalkan registrasi sensor yang belum terverifikasi
      description: >
        Menghapus node yang BELUM diverifikasi operator, dibuktikan dengan
        provisioning_secret mentahnya. Kepemilikan bersifat capability-based:
        iot_nodes tidak punya kolom owner, jadi hak menghapus dibuktikan lewat
        PENGETAHUAN secret, bukan lewat identitas pemanggil. JWT tetap wajib,
        tetapi hanya sebagai pagar laju.


        Dipakai wizard "Add a Sensor" untuk membersihkan registrasi yang
        ditinggalkan pengguna di tengah jalan, sehingga station_id tidak menjadi
        baris pending yang tidak pernah berdenyut.


        IDEMPOTEN: station_id yang tidak dikenal (atau sudah dibatalkan) menjawab
        200 dengan `deleted: false`, bukan 404 — retry setelah sukses bukan error.
        Node yang SUDAH terverifikasi tidak dapat dibatalkan pengguna (409):
        penarikan kepercayaan adalah aksi operator.


        provisioning_secret dikirim di body dan TIDAK pernah masuk log maupun
        respons.
      operationId: revokeNode
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRequest'
      responses:
        '200':
          description: >
            Permintaan diproses. `deleted: true` bila baris pending benar-benar
            dihapus; `deleted: false` bila station_id tidak dikenal (idempoten).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            provisioning_secret tidak cocok untuk station_id ini. Pesan sengaja
            generik dan perbandingannya constant-time: respons tidak membedakan
            salah-id dari salah-secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SECRET_MISMATCH
                message: provisioning_secret tidak cocok untuk station_id ini
        '404':
          description: >
            station_id tidak berpola NODE-XXXXXXXX (hex kapital). Bentuk yang
            salah ditolak sebelum menyentuh basis data. Perhatikan: station_id
            berbentuk sah yang tidak ada di basis data menjawab 200
            `deleted: false`, bukan 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NODE_NOT_FOUND
                message: station_id harus berpola NODE-XXXXXXXX (hex kapital)
        '409':
          description: >
            Node sudah diverifikasi operator — di luar yurisdiksi pengguna. Juga
            dikembalikan bila verifikasi terjadi TEPAT di antara pemeriksaan
            secret dan DELETE: predikat `verified = FALSE` ada di dalam SQL,
            sehingga balapan terserialisasi di lock baris Postgres dan node
            terverifikasi mustahil terhapus.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NODE_VERIFIED
                message: node sudah diverifikasi operator dan tidak dapat dibatalkan pengguna
        '429':
          description: >
            Batas laju pembatalan: cooldown 12 menit per akun. Endpoint ini
            menerima secret mentah di body, jadi pagar laju berdiri SEBELUM
            kripto dijalankan untuk menutup jalur brute-force.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: RATE_LIMITED
                message: pembatalan dibatasi, coba lagi nanti
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/sensors:
    get:
      tags: [sensors]
      summary: Daftar sensor + status (peta, RSSI, ping)
      operationId: listSensors
      security:
        - bearerAuth: []
      parameters:
        - name: range_km
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 500
          description: Radius filter dari lokasi user (km).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users/pseudonym/reroll:
    post:
      tags: [users]
      summary: Reroll pseudonym (rate-limited 1x/60s per user)
      operationId: rerollPseudonym
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RerollResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Terlalu sering; coba lagi nanti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/users/location:
    put:
      tags: [users]
      summary: Perbarui lokasi terakhir user (PostGIS)
      description: >
        Menyimpan koordinat user ke user_profiles.last_location
        (GEOGRAPHY(Point,4326)) sebagai basis filter radius pada /sensors dan
        penargetan alert. location_name adalah label hasil reverse-geocode di
        sisi klien dan bersifat opsional. Tidak ada radius yang diterima dari
        klien: radius peringatan tetap 200 km dengan override intensitas untuk
        gempa parah (MMI >= VII atau PGA >= 250 gal), keputusan sistem dan bukan
        preferensi per user.
      operationId: updateUserLocation
      x-client: true # dipakai klien Android (docs/CLIENT_SPEC.md)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateLocationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users/fcm-token:
    put:
      tags: [users]
      summary: Daftarkan/perbarui FCM registration token
      description: >
        Menyimpan token Firebase Cloud Messaging perangkat agar alert
        life-safety tetap sampai saat aplikasi berada di background.
      operationId: updateUserFCMToken
      x-client: true # dipakai klien Android (docs/CLIENT_SPEC.md)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFCMTokenRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateFCMTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/chat/channels:
    get:
      tags: [chat]
      summary: Kanal chat yang boleh diakses pemanggil
      description: >
        Server yang menjawab kanal mana yang menjadi keanggotaan user, bukan
        klien yang menebak kuncinya: kanal regional adalah turunan region_code
        yang tersimpan dari PUT /users/location, dan klien yang menyusun kunci
        sendiri akan meminta ruang yang tidak ada begitu normalisasi di server
        berubah. Kanal `global` selalu ada dan merupakan satu-satunya kanal yang
        berfungsi sebelum user pernah menyinkronkan posisi.
      operationId: listChatChannels
      x-client: true # dipakai klien Android (docs/CLIENT_SPEC.md)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatChannelsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/chat/messages:
    get:
      tags: [chat]
      summary: Riwayat pesan satu kanal (terbaru lebih dulu)
      description: >
        Paginasi memakai kursor waktu `before`, BUKAN offset: ruang yang aktif
        menggeser offset di antara dua permintaan, sehingga halaman berikutnya
        akan melewatkan atau menggandakan baris tepat saat percakapan ramai.
        Untuk memuat halaman berikutnya, kirim created_at pesan tertua yang sudah
        diterima. Pesan lebih lama dari 7 hari dihapus oleh retensi.
      operationId: listChatMessages
      x-client: true # dipakai klien Android (docs/CLIENT_SPEC.md)
      security:
        - bearerAuth: []
      parameters:
        - name: channel_id
          in: query
          required: false
          schema:
            type: string
            maxLength: 50
            default: global
          description: Default `global` bila tidak dikirim.
          example: ID-jawa-barat
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
          description: Nilai di atas 100 dibatasi ke 100, bukan ditolak.
        - name: before
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Kursor eksklusif; hanya pesan dengan created_at lebih awal.
          example: '2026-06-20T00:19:18Z'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessagesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Kanal bukan keanggotaan user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [chat]
      summary: Kirim satu pesan ke kanal
      description: >
        Pengiriman lewat REST, bukan lewat WebSocket: REST bersifat durable dan
        bisa diulang, sedangkan socket hanya memfanout apa yang sudah tersimpan,
        sehingga kegagalan siaran tidak pernah menghilangkan pesan. Sertakan
        client_message_id agar pengiriman idempoten - klien yang timeout tidak
        tahu apakah percobaan pertamanya sampai, dan pesan ganda di ruang publik
        tidak bisa ditarik kembali. Batas laju 1 pesan / 2 detik per user.
      operationId: createChatMessage
      x-client: true # dipakai klien Android (docs/CLIENT_SPEC.md)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatMessageRequest'
      responses:
        '201':
          description: >
            Tersimpan. Pengiriman ulang dengan client_message_id yang sama
            mengembalikan baris yang SAMA, bukan galat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Kanal bukan keanggotaan user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Melewati batas laju kirim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/events:
    get:
      tags: [events]
      summary: Riwayat kejadian gempa terkonfirmasi
      description: >
        Mengembalikan event terurut `created_at DESC` (terbaru dulu).
        Autentikasi opsional: tanpa Bearer token endpoint tetap melayani
        (data gempa bersifat publik), namun bila header Authorization dikirim
        token WAJIB valid — token kedaluwarsa/rusak ditolak 401, bukan
        diperlakukan sebagai anonim.
        Filter spasial aktif hanya bila `latitude`, `longitude`, dan `range_km`
        dikirim bersamaan (ST_DWithin pada estimated_centroid).
        Tiga filter tambahan bersifat independen dan boleh digabung:
        `min_pga` (ambang intensitas), `since` dan `until` (rentang waktu
        `started_at`). Semuanya dievaluasi di SQL, bukan di klien, agar
        paginasi tetap mengembalikan halaman penuh — menyaring hasil setelah
        `limit` akan membuat halaman pendek dan merusak deteksi akhir data
        pada infinite scroll klien.
      operationId: listEvents
      x-client: true # dipakai klien Android (docs/CLIENT_SPEC.md)
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Jumlah maksimum event yang dikembalikan.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 50000
          description: >
            Offset paginasi. Dibatasi 50000 (internal/api: maxEventsOffset) agar
            offset liar tidak memicu scan O(offset) pada indeks started_at DESC;
            nilai di luar rentang ditolak 400 INVALID_ARGUMENT, bukan di-clamp.
        - name: range_km
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 2000
          description: >
            Radius filter dari (latitude, longitude). Wajib disertai kedua
            koordinat; bila salah satu absen server menolak 400.
        - name: latitude
          in: query
          required: false
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          description: Latitude acuan filter radius.
        - name: longitude
          in: query
          required: false
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          description: Longitude acuan filter radius.
        - name: min_pga
          in: query
          required: false
          schema:
            type: number
            format: double
            minimum: 0
            maximum: 2000
          description: >
            Ambang bawah intensitas dalam PGA (gal): hanya event dengan
            `max_pga >= min_pga` dikembalikan. Ambang dikirim dalam gal — bukan
            MMI — karena `earthquake_events.mmi_scale` adalah angka Romawi
            (VARCHAR) sementara `max_pga` NUMERIC dapat dibandingkan langsung
            tanpa kolom turunan baru. Klien memetakan pilihan MMI ke gal memakai
            tabel ambang SYSTEM_SPEC Bab 5.3 yang sama dengan
            server/internal/consensus (Intensity/MMIFromPGA), sehingga label UI
            tetap berbicara MMI.
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: >
            Batas bawah rentang waktu (inklusif) pada `started_at`, RFC3339.
            Ditolak 400 bila tidak dapat diparse, atau bila lebih besar dari
            `until`.
        - name: until
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: >
            Batas atas rentang waktu (inklusif) pada `started_at`, RFC3339.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/broadcasts:
    get:
      tags: [broadcasts]
      summary: Pengumuman operator yang berlaku bagi pemanggil
      description: >
        Mengembalikan pengumuman nasional ditambah yang menyasar wilayah
        pemanggil, terbaru dulu. Wilayah diambil dari `region_code` TERSIMPAN di
        profil, bukan dari query: kalau tidak, siapa pun dapat membaca pengumuman
        wilayah lain hanya dengan mengubah URL, dan yang lebih sering terjadi,
        tidak akan pernah melihat pengumuman wilayahnya sendiri begitu klien
        salah menyusun kuncinya. Pengumuman lebih lama dari 90 hari tidak lagi
        dikembalikan.
      operationId: listBroadcasts
      x-client: true # dipakai klien Android (docs/CLIENT_SPEC.md)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/broadcasts:
    post:
      tags: [broadcasts]
      summary: Menerbitkan satu pengumuman operator
      description: >
        Diproteksi shared secret di header `X-Admin-Key`, BUKAN JWT: pengirimnya
        adalah skrip di host terpercaya (deploy/scripts/broadcast.sh), kuncinya
        tidak pernah ikut dalam APK, dan pencabutannya cukup mengganti env lalu
        restart. Bila `ADMIN_API_KEY` tidak di-set, rute ini tidak didaftarkan
        sama sekali dan menjawab 404 — instalasi yang lupa mengisinya kehilangan
        fiturnya, bukan pagarnya.


        Server menyimpan lebih dulu, lalu memfanout (WebSocket + FCM data-only,
        prioritas NORMAL pada kanal notifikasi ber-importance rendah milik
        klien). Pengumuman tidak pernah terlihat atau berbunyi seperti alert
        gempa. Siaran regional dikirim HANYA ke token wilayah itu dan tidak
        pernah jatuh ke topic nasional bila wilayahnya kosong.
      operationId: createBroadcast
      security:
        - adminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBroadcastRequest'
      responses:
        '201':
          description: Tersimpan dan difanout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Broadcast'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Header X-Admin-Key tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/nodes/pending:
    get:
      tags: [nodes]
      summary: Daftar node yang menunggu verifikasi operator
      description: >
        Semua node dengan `verified = false`, terbaru dulu. Node pending tetap
        tampak di `/sensors` (heartbeat diterima) tetapi trigger-nya ditolak di
        jalur ingest sehingga tidak pernah ikut voting menuju ambang 3-node
        CONFIRMED.
      operationId: listPendingNodes
      security:
        - adminKey: []
      responses:
        '200':
          description: Daftar (bisa kosong — bukan keadaan galat)
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/PendingNode'
        '401':
          description: Header X-Admin-Key tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/nodes/{stationID}/verify:
    post:
      tags: [nodes]
      summary: Mengubah status verifikasi satu node
      description: >
        Body opsional; absen/kosong berarti setuju (`verified = true`) — kasus
        umum skrip deploy/scripts/verify-node.sh. Kirim `{"verified": false}`
        untuk menarik kembali kepercayaan: trigger node itu langsung ditolak di
        jalur ingest tanpa menyentuh `is_active`. station_id yang salah bentuk
        atau tidak dikenal menjawab 404 dan tidak pernah menyentuh basis data.
      operationId: verifyNode
      security:
        - adminKey: []
      parameters:
        - name: stationID
          in: path
          required: true
          schema:
            type: string
            pattern: '^NODE-[0-9A-F]{8}$'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                verified:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Status verifikasi diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  station_id:
                    type: string
                    example: NODE-163A149F
                  verified:
                    type: boolean
        '401':
          description: Header X-Admin-Key tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: station_id salah bentuk atau tidak dikenal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NODE_NOT_FOUND
                message: station_id tidak ditemukan
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/tracker/stats:
    get:
      tags: [admin]
      summary: Potret counter event Tracker
      description: >
        Mengembalikan seluruh counter §15.5 dalam satu snapshot atom: event_created,
        transisi per state, gauge terbuka/tombstone, reonset_splits, diameter_rejections,
        stale_absorbed, dan counter kegagalan persistensi. Read-only, tidak mengubah
        state Tracker. Mengembalikan 503 bila EVENT_TRACKER_ENABLED=false.
      operationId: getTrackerStats
      security:
        - adminKey: []
      responses:
        '200':
          description: Counter berhasil dibaca
          content:
            application/json:
              schema:
                type: object
                properties:
                  event_created_total:
                    type: integer
                    format: int64
                  event_forced_resolutions_total:
                    type: integer
                    format: int64
                  event_reonset_splits_total:
                    type: integer
                    format: int64
                  event_diameter_rejections_total:
                    type: integer
                    format: int64
                  event_stale_evidence_absorbed_total:
                    type: integer
                    format: int64
                  event_tombstone_evictions_total:
                    type: integer
                    format: int64
                  event_reconciled_total:
                    type: integer
                    format: int64
                  event_persist_dropped_total:
                    type: integer
                    format: int64
                  event_upsert_failures_total:
                    type: integer
                    format: int64
                  event_state_log_failures_total:
                    type: integer
                    format: int64
                  event_state_log_skipped_total:
                    type: integer
                    format: int64
                  event_near_confirmed_persist_dropped_total:
                    type: integer
                    format: int64
                    description: >
                      Catatan near-confirmation yang dijatuhkan antrean ledger (drop-oldest).
                      DILAPORKAN, bukan target: S1 mengizinkan pencatatan gagal agar jalur
                      peringatan tidak pernah terhambat. Tidak ada SLO nol untuk angka ini.
                  event_near_confirmed_upsert_failures_total:
                    type: integer
                    format: int64
                    description: >
                      Upsert event_near_confirmed yang gagal di basis data. Sama seperti di
                      atas: dilaporkan, tanpa target nol.
                  event_transitions_to_unconfirmed_total:
                    type: integer
                    format: int64
                  event_transitions_to_confirmed_total:
                    type: integer
                    format: int64
                  event_transitions_to_resolved_total:
                    type: integer
                    format: int64
                  event_transitions_to_cancelled_total:
                    type: integer
                    format: int64
                  event_open_gauge:
                    type: integer
                  event_tombstone_gauge:
                    type: integer
                  event_latency_onset_to_decided_sensor_ms:
                    $ref: '#/components/schemas/LatencyStats'
                    description: >
                      Latensi onset -> keputusan Tracker untuk observasi dengan onset
                      TERUKUR SENSOR. Ini sebuah pengukuran. Hanya transisi ke
                      UNCONFIRMED dan CONFIRMED dihitung: RESOLVED dan CANCELLED
                      digerakkan timer ResolveAfterMs, bukan bukti, jadi memasukkannya
                      akan melaporkan timer resolve sebagai latensi deteksi.
                  event_latency_onset_to_decided_publish_bound_ms:
                    $ref: '#/components/schemas/LatencyStats'
                    description: >
                      Seri yang sama untuk observasi yang onsetnya disimpulkan sebagai
                      publish_ts - dur_ms (PUBLISH_BOUND). Ini BATAS ATAS, bukan
                      pengukuran — galatnya adalah keterlambatan publish. Dilaporkan
                      terpisah justru supaya tidak dibaca sebagai pengukuran, dan tidak
                      boleh digabungkan dengan seri sensor.
                  event_latency_decided_to_emit_ms:
                    $ref: '#/components/schemas/LatencyStats'
                    description: >
                      Latensi keputusan Tracker -> penyerahan frame ke sink dispatch,
                      untuk SETIAP transisi termasuk yang terminal: biaya penyerahan
                      frame tidak bergantung pada state tujuan. Kedua ujungnya jam
                      server yang sama. TIDAK mencakup tahap sisi klien apa pun:
                      pengiriman jaringan, bangun perangkat, heads-up, dan sirene
                      tidak masuk angka ini.
        '401':
          description: Header X-Admin-Key tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: EVENT_TRACKER_ENABLED=false — Tracker tidak aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/tracker/near-confirmed:
    get:
      tags: [admin]
      summary: Log event yang mencapai >= 2 kontributor independen
      description: >
        Mengembalikan semua event yang pernah mencapai >= MinIndependentCells kontributor
        independen: yang disaksikan proses ini, DITAMBAH yang dibaca kembali dari tabel
        durable event_near_confirmed saat boot (P4-M2′). Untuk setiap entry: kapan pertama
        kali mencapai kondisi itu, apakah akhirnya CONFIRMED, kapan terminal, berapa lama
        macet, beserta ambang dan algo_ver yang BERLAKU saat persilangan itu.


        Cakupan jawaban TIDAK boleh disimpulkan dari panjang `entries`: `entries: []`
        dapat berarti "tidak ada satu pun persilangan yang pernah terjadi" atau "tidak
        ada yang dapat dijawab", dan pada fleet satu-node arti pertama adalah jawaban
        yang BENAR karena kuorum tidak terjangkau (S2). Objek `coverage` menyatakan yang
        mana. Read-only, tidak mengubah state Tracker. Mengembalikan 503 bila
        EVENT_TRACKER_ENABLED=false.
      operationId: getTrackerNearConfirmed
      security:
        - adminKey: []
      responses:
        '200':
          description: Log berhasil dibaca
          content:
            application/json:
              schema:
                type: object
                required: [entries, coverage]
                properties:
                  entries:
                    type: array
                    description: >
                      Tetap array tingkat atas dengan nama yang sama seperti sebelum
                      P4-M2′: `coverage` bersifat ADITIF, bukan pembungkus. Selalu array,
                      tidak pernah null.
                    items:
                      type: object
                      required:
                        - event_id
                        - first_two_independent_at_ms
                        - independent_count_at_peak
                        - node_count_at_peak
                        - min_independent_cells
                        - algo_ver
                        - source
                      properties:
                        event_id:
                          type: string
                        first_two_independent_at_ms:
                          type: integer
                          format: int64
                          description: Unix ms saat pertama kali mencapai >= MinIndependentCells independen.
                        independent_count_at_peak:
                          type: integer
                          description: Jumlah kontributor independen tertinggi yang dicapai event.
                        node_count_at_peak:
                          type: integer
                          description: Total kontributor saat puncak independensi.
                        confirmed_at_ms:
                          type: integer
                          format: int64
                          description: Unix ms saat CONFIRMED. 0 atau absen = tidak pernah CONFIRMED.
                        terminal_state:
                          type: string
                          enum: [RESOLVED, CANCELLED]
                          description: State terminal akhir. Absen = event masih terbuka.
                        terminal_at_ms:
                          type: integer
                          format: int64
                          description: Unix ms saat terminal. 0 atau absen = masih terbuka.
                        min_independent_cells:
                          type: integer
                          description: >
                            Ambang independensi yang BERLAKU saat persilangan itu, dicatat
                            saat itu dan dibawa apa adanya. Bukan nilai konfigurasi
                            sekarang: sebuah hitungan independensi hanya dapat ditafsirkan
                            bersama ambang yang menghasilkannya.
                        algo_ver:
                          type: string
                          description: >
                            algo_ver yang berlaku saat persilangan itu, mis.
                            phase3-1.1/ic=5. Tidak pernah ditulis ulang untuk baris lama
                            (D-006).
                        source:
                          type: string
                          enum: [RECORDED, LOADED]
                          description: >
                            RECORDED = persilangannya disaksikan oleh proses ini.
                            LOADED = dibaca kembali dari event_near_confirmed saat boot;
                            proses ini tidak menyaksikannya.
                        updated_in_process:
                          type: boolean
                          description: >
                            Absen/false kecuali sebuah entri LOADED kemudian berubah di
                            proses ini (puncak naik, atau menjadi terminal). Provenance
                            tetap LOADED: entri itu tidak boleh mengaku disaksikan.
                  coverage:
                    type: object
                    description: >
                      Selubung cakupan (B1). Ia ada karena `entries: []` punya dua arti
                      yang terkirim sebagai byte identik tanpa selubung ini. Tidak ada
                      field complete, healthy, atau valid — ini pengukuran cakupan, bukan
                      penilaian.
                    required:
                      - process_started_at_ms
                      - as_of_ms
                      - durable_read_attempted
                      - durable_read_ok
                      - durable_rows_loaded
                      - entries_recorded_in_process
                      - entries_loaded_from_durable
                      - algo_ver
                      - min_independent_cells
                    properties:
                      process_started_at_ms:
                        type: integer
                        format: int64
                        description: >
                          Unix ms saat proses ini mulai. Awal jendela yang dijamin
                          tercatat oleh proses ini sendiri.
                      as_of_ms:
                        type: integer
                        format: int64
                        description: Unix ms saat jawaban ini dibentuk (ujung akhir jendela).
                      durable_read_attempted:
                        type: boolean
                        description: >
                          Apakah pembacaan tabel durable dicoba saat boot. false berarti
                          store yang terpasang tidak menyediakan kapabilitas itu — bukan
                          berarti tabelnya kosong.
                      durable_read_ok:
                        type: boolean
                        description: >
                          Apakah pembacaan itu berhasil. false dengan attempted=true
                          berarti riwayat sebelum boot TIDAK terwakili di `entries`.
                      durable_read_at_ms:
                        type: integer
                        format: int64
                        description: Unix ms pembacaan durable. Absen bila tidak pernah dicoba.
                      durable_rows_loaded:
                        type: integer
                        description: Jumlah baris yang terbaca dari event_near_confirmed.
                      durable_read_error:
                        type: string
                        description: >
                          Galat pembacaan durable, bila ada. Dilaporkan, tidak ditelan
                          menjadi daftar kosong.
                      entries_recorded_in_process:
                        type: integer
                        description: Entri yang persilangannya disaksikan proses ini.
                      entries_loaded_from_durable:
                        type: integer
                        description: Entri yang berasal dari tabel durable.
                      algo_ver:
                        type: string
                        description: >
                          algo_ver biner yang sedang berjalan. Dapat berbeda dari algo_ver
                          sebuah entri, dan perbedaan itu bermakna (D-006).
                      min_independent_cells:
                        type: integer
                        description: >
                          Ambang yang berlaku SEKARANG. Dapat berbeda dari
                          min_independent_cells sebuah entri.
        '401':
          description: Header X-Admin-Key tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: EVENT_TRACKER_ENABLED=false — Tracker tidak aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
      description: >
        Shared secret operator, minimal 32 byte, dibandingkan dengan
        crypto/subtle.ConstantTimeCompare. Dipakai HANYA oleh /api/v1/admin/*.

  responses:
    BadRequest:
      description: Request tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: JWT tidak ada / tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Kesalahan internal server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >
            Kode mesin yang stabil. Nilai yang dipakai server:
            INVALID_ARGUMENT, UNAUTHENTICATED, STATION_ALREADY_EXISTS,
            RATE_LIMITED, INTERNAL, dan — khusus /api/v1/nodes/revoke —
            SECRET_MISMATCH, NODE_NOT_FOUND, NODE_VERIFIED.
          enum:
            - INVALID_ARGUMENT
            - UNAUTHENTICATED
            - STATION_ALREADY_EXISTS
            - RATE_LIMITED
            - INTERNAL
            - SECRET_MISMATCH
            - NODE_NOT_FOUND
            - NODE_VERIFIED
          example: INVALID_ARGUMENT
        message:
          type: string
          example: latitude di luar rentang -90..90

    AnonymousAuthResponse:
      type: object
      required: [token, token_type, expires_at, user_id, pseudonym, created_at]
      properties:
        token:
          type: string
          description: JWT HS256 dengan klaim `sub` (=user_id), `iat`, `exp`.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIzYTc4...
        token_type:
          type: string
          enum: [Bearer]
          example: Bearer
        expires_at:
          type: string
          format: date-time
          description: Waktu kedaluwarsa token (RFC3339 UTC), sama dengan klaim `exp`.
          example: 2026-09-18T11:02:00Z
        user_id:
          type: string
          format: uuid
          example: 3a78f1c2-9d4e-4b0a-8f77-2c1b5e9a6d30
        pseudonym:
          type: string
          maxLength: 32
          example: Quakezen-7B9A
        created_at:
          type: string
          format: date-time
          example: 2026-08-19T11:02:00Z

    ProvisionRequest:
      type: object
      additionalProperties: false
      required: [sensor_model, location_name, latitude, longitude]
      properties:
        station_id:
          type: string
          description: >-
            Opsional. Station ID yang sudah di-generate node (disimpan di NVS)
            agar ID di firmware & DB identik. Bila diisi, server memakai nilai
            ini; bila kosong/absen, server men-generate sendiri lalu
            mengembalikannya di ProvisionResponse.
          pattern: '^NODE-[0-9A-F]{8}$'
          example: NODE-163A149F
        sensor_model:
          type: string
          example: MPU 6050
        location_name:
          type: string
          maxLength: 150
          example: Cimahi, West Java, ID
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: -6.8721
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 107.5422

    ProvisionResponse:
      type: object
      required: [station_id, provisioning_secret, mqtt_broker, mqtt_port, mqtt_tls]
      properties:
        station_id:
          type: string
          example: NODE-163A149F
        provisioning_secret:
          type: string
          description: One-time secret; TIDAK pernah dikembalikan lagi.
          example: sec_key_991823719283719
        mqtt_broker:
          type: string
          example: broker.quakealert.id
        mqtt_port:
          type: integer
          example: 8883
        mqtt_tls:
          type: boolean
          example: true

    RevokeRequest:
      type: object
      additionalProperties: false
      required: [station_id, provisioning_secret]
      properties:
        station_id:
          type: string
          pattern: '^NODE-[0-9A-F]{8}$'
          example: NODE-163A149F
        provisioning_secret:
          type: string
          description: >-
            Secret one-time dari ProvisionResponse, apa adanya. Membuktikan hak
            menghapus; tidak pernah dicatat di log maupun dikembalikan.
          example: sec_key_991823719283719

    RevokeResponse:
      type: object
      required: [station_id, deleted]
      properties:
        station_id:
          type: string
          example: NODE-163A149F
        deleted:
          type: boolean
          description: >-
            true bila baris pending dihapus oleh permintaan ini; false bila
            station_id tidak dikenal (sudah dibatalkan / tidak pernah ada).
            Klien memperlakukan keduanya sebagai sukses.
          example: true

    SensorsResponse:
      type: object
      required: [range_km, active_sensors_count, stations]
      properties:
        range_km:
          type: integer
          example: 50
        active_sensors_count:
          type: integer
          example: 2
        stations:
          type: array
          items:
            $ref: '#/components/schemas/Station'

    Station:
      type: object
      required: [station_id, sensor_model, location_name, latitude, longitude, status]
      properties:
        station_id:
          type: string
          example: NODE-163A149F
        sensor_model:
          type: string
          example: MPU 6050
        location_name:
          type: string
          example: Cimahi, West Java, ID
        latitude:
          type: number
          format: double
          example: -6.8721
        longitude:
          type: number
          format: double
          example: 107.5422
        status:
          type: string
          enum: [Online, Offline]
          example: Online
        last_ping:
          type: string
          description: Human-readable relative time.
          example: 33s ago
        rssi_dbm:
          type: integer
          example: -61
        latency_ms:
          type: integer
          example: 2

    RerollResponse:
      type: object
      required: [pseudonym, updated_at]
      properties:
        pseudonym:
          type: string
          example: Quakezen-7B9A
        region_code:
          type: [string, "null"]
          maxLength: 50
          description: >
            Kanal chat regional yang berlaku setelah pembaruan ini, atau null
            bila wilayahnya tidak dapat dinormalisasi (mis. nama non-ASCII) atau
            tidak dapat dibaca. Dalam kasus itu user hanya punya kanal global.
            Bila wilayah tidak dikirim, ini adalah kanal yang sudah tersimpan.
          example: ID-jawa-barat
        updated_at:
          type: string
          format: date-time
          example: 2026-08-17T18:30:00Z

    ChatChannel:
      type: object
      required: [channel_id, kind, display_name]
      properties:
        channel_id:
          type: string
          maxLength: 50
          description: >
            `global`, atau kunci regional `<ISO2>-<slug-admin1>`. Kunci ini
            disusun server dari wilayah yang dikirim ke PUT /users/location.
          example: ID-jawa-barat
        kind:
          type: string
          enum: [GLOBAL, REGIONAL]
          example: REGIONAL
        display_name:
          type: string
          maxLength: 80
          description: >
            Judul kanal milik penulis pertama, bukan ejaan ponsel pemanggil,
            sehingga setiap anggota melihat satu judul yang sama.
          example: Jawa Barat

    ChatChannelsResponse:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          description: Kanal global selalu berada di indeks pertama.
          items:
            $ref: '#/components/schemas/ChatChannel'

    CreateBroadcastRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          maxLength: 120
          description: Spasi berganda dan newline diratakan sebelum disimpan.
          example: Gladi resik peringatan dini
        body:
          type: string
          maxLength: 500
          example: Pukul 10.00 WIB akan ada uji sirene. Tidak perlu evakuasi.
        region_code:
          type: string
          maxLength: 64
          description: >
            Opsional. Absen atau kosong = nasional. Kuncinya sama dengan kanal
            chat regional dan dinormalisasi ulang server lewat fungsi yang sama
            dengan PUT /users/location, sehingga "ID-Jawa Barat" dan
            "id-jawa-barat" mendarat pada satu kunci. Bentuk yang tidak dapat
            dinormalisasi ditolak 400, bukan diperlakukan sebagai nasional.
          example: ID-jawa-barat

    Broadcast:
      type: object
      required: [broadcast_id, title, body, region_code, created_at]
      properties:
        broadcast_id:
          type: string
          format: uuid
          example: 9c2f1a44-6e1b-4f0a-9a77-3d5b6c7e8f91
        title:
          type: string
          maxLength: 120
          example: Gladi resik peringatan dini
        body:
          type: string
          maxLength: 500
          example: Pukul 10.00 WIB akan ada uji sirene. Tidak perlu evakuasi.
        region_code:
          type: string
          nullable: true
          maxLength: 64
          description: null = pengumuman nasional.
          example: ID-jawa-barat
        created_at:
          type: string
          format: date-time
          example: "2026-08-23T06:19:18Z"

    PendingNode:
      type: object
      required: [station_id, sensor_model, location_name, latitude, longitude, created_at]
      properties:
        station_id:
          type: string
          example: NODE-163A149F
        sensor_model:
          type: string
          example: MPU 6050
        location_name:
          type: string
          description: >
            Nama tempat yang dapat ditemukan di peta, konvensi
            "Kecamatan, Kabupaten/Kota, Provinsi".
          example: Cimahi, Jawa Barat
        latitude:
          type: number
          format: double
          example: -6.87
        longitude:
          type: number
          format: double
          example: 107.54
        created_at:
          type: string
          format: date-time
          description: Saat node di-provision; daftar diurutkan terbaru dulu.
          example: "2026-08-24T09:00:00Z"

    BroadcastsResponse:
      type: object
      required: [broadcasts]
      properties:
        broadcasts:
          type: array
          description: Terbaru lebih dulu.
          items:
            $ref: '#/components/schemas/Broadcast'

    ChatMessage:
      type: object
      required: [message_id, channel_id, sender_id, sender_pseudonym, message, is_admin, created_at]
      properties:
        message_id:
          type: string
          format: uuid
          example: 8f14e45f-ceea-467a-9c3f-2b0c4d5e6f70
        channel_id:
          type: string
          maxLength: 50
          example: ID-jawa-barat
        sender_id:
          type: string
          description: >
            UUID pengirim, atau string kosong bila profilnya sudah dihapus
            (FK ON DELETE SET NULL). Klien memakainya untuk mengenali pesannya
            sendiri.
          example: 3a78f1c2-9d4e-4b0a-8f77-2c1b5e9a6d30
        sender_pseudonym:
          type: string
          maxLength: 32
          description: >
            SNAPSHOT saat pesan dikirim, bukan hasil join: pseudonym dapat
            di-reroll, dan riwayat tidak boleh berganti nama secara retroaktif.
          example: AnonimTenang
        sender_location_tag:
          type: string
          maxLength: 50
          description: Opsional. Label lokasi pengirim saat pesan dikirim.
          example: Bandung
        message:
          type: string
          maxLength: 500
          example: Aman di sini, hanya lampu bergoyang.
        is_admin:
          type: boolean
          description: >
            Belum dipakai: tidak ada jalur admin yang dibangun (lihat
            docs/CHAT_DESIGN.md bagian 7). Selalu false untuk saat ini.
          example: false
        created_at:
          type: string
          format: date-time
          example: '2026-06-20T00:19:18Z'

    ChatMessagesResponse:
      type: object
      required: [channel_id, limit, count, messages]
      properties:
        channel_id:
          type: string
          example: ID-jawa-barat
        limit:
          type: integer
          example: 30
        count:
          type: integer
          description: >
            Jumlah pesan pada halaman ini. count < limit berarti tidak ada
            halaman lebih lama lagi.
          example: 30
        messages:
          type: array
          description: Urutan menurun berdasarkan created_at (terbaru lebih dulu).
          items:
            $ref: '#/components/schemas/ChatMessage'

    CreateChatMessageRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        channel_id:
          type: string
          maxLength: 50
          default: global
          description: Default `global` bila tidak dikirim.
          example: ID-jawa-barat
        message:
          type: string
          minLength: 1
          maxLength: 500
          description: >
            Dihitung dalam karakter (rune), bukan byte: batas berbasis byte akan
            memotong teks non-Latin jauh lebih pendek daripada 500 karakter yang
            dijanjikan ke user. Spasi di tepi dipangkas server; body yang hanya
            berisi spasi ditolak 400.
          example: Aman di sini, hanya lampu bergoyang.
        client_message_id:
          type: string
          format: uuid
          description: >
            Opsional tapi sangat disarankan. Kunci idempotensi: pengiriman ulang
            dengan nilai yang sama mengembalikan pesan yang sama alih-alih
            membuat duplikat.
          example: 5c2d1e90-3b7a-4f61-8e0d-9a4b7c6d5e1f

    UpdateLocationRequest:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: -6.8721
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 107.5422
        location_name:
          type: string
          maxLength: 150
          description: >
            Opsional. Label hasil reverse-geocode di sisi klien. Karena
            endpoint ini bersemantik PUT (replace), mengirim body tanpa
            location_name akan MENGOSONGKAN label yang tersimpan sebelumnya.
          example: Cimahi, West Java, ID
        country_iso:
          type: string
          minLength: 2
          maxLength: 2
          description: >
            Opsional. Kode negara ISO-3166 alpha-2 dari reverse-geocode klien.
            Bersama admin_area, server menurunkannya menjadi kunci kanal chat
            regional. Dinormalisasi di server: ejaan yang berbeda untuk provinsi
            yang sama harus mendarat di satu kanal. Bila country_iso dan
            admin_area sama-sama absen, region yang tersimpan DIBIARKAN — bukan
            dikosongkan.
          example: ID
        admin_area:
          type: string
          maxLength: 100
          description: >
            Opsional. Nama wilayah administratif tingkat 1 (provinsi/negara
            bagian). Granularitas ini disengaja: cukup kasar sehingga keanggotaan
            kanal bukan pengungkapan lokasi, cukup spesifik sehingga "gempa di
            dekat saya" masih relevan.
          example: Jawa Barat

    UpdateLocationResponse:
      type: object
      required: [user_id, latitude, longitude, updated_at]
      properties:
        user_id:
          type: string
          format: uuid
          example: 3a78f1c2-9d4e-4b0a-8f77-2c1b5e9a6d30
        latitude:
          type: number
          format: double
          example: -6.8721
        longitude:
          type: number
          format: double
          example: 107.5422
        location_name:
          type: [string, "null"]
          maxLength: 150
          description: null bila user belum/tidak mengirim label lokasi.
          example: Cimahi, West Java, ID
        updated_at:
          type: string
          format: date-time
          example: 2026-08-19T11:02:00Z

    UpdateFCMTokenRequest:
      type: object
      additionalProperties: false
      required: [fcm_token]
      properties:
        fcm_token:
          type: string
          minLength: 1
          maxLength: 255
          example: fMEP0vJq...:APA91bH-Xy9
    UpdateFCMTokenResponse:
      type: object
      required: [updated_at]
      properties:
        updated_at:
          type: string
          format: date-time
          example: 2026-08-19T11:02:00Z

    EventsResponse:
      type: object
      required: [limit, offset, count, events]
      properties:
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
        count:
          type: integer
          description: Jumlah event pada halaman ini (bukan total keseluruhan).
          example: 1
        range_km:
          type: [integer, "null"]
          description: Radius yang dipakai bila filter spasial aktif; null bila tidak.
          example: 300
        events:
          type: array
          items:
            $ref: '#/components/schemas/EarthquakeEvent'

    EarthquakeEvent:
      type: object
      description: >
        Satu baris earthquake_events. Umpan ini hanya melepas event yang PERNAH
        CONFIRMED (>= 3 node unik pada >= 2 sel independen), jadi seluruh isinya
        sudah terkonfirmasi konsensus. Sejak Fase 3 event UNCONFIRMED (1-2 node)
        juga dipersistensikan agar dapat ditingkatkan lalu dicabut, tetapi ia
        tidak pernah menjadi klaim publik dan karena itu tidak pernah muncul di
        sini — termasuk setelah ia berakhir. Konsekuensinya
        triggered_nodes_count tetap >= 3 dan event_state di sini tidak pernah
        bernilai UNCONFIRMED.
      required:
        [event_id, status, pga, mmi, intensity_label, latitude, longitude,
         location_name, triggered_nodes_count, created_at]
      properties:
        event_id:
          type: string
          format: uuid
          example: a3f1c9de-51b2-4c77-9a0e-8d6f3b2c1a04
        status:
          type: string
          enum: [HAPPENING, RESOLVED]
          example: RESOLVED
        pga:
          type: number
          format: double
          description: max_pga dalam gal (cm/s^2) — satuan kanonik, konversi ke g hanya untuk tampilan.
          example: 413.13
        mmi:
          type: string
          description: mmi_scale (angka Romawi).
          example: V
        intensity_label:
          type: string
          description: >
            Label intensitas yang diemisi konsensus, HURUF KECIL
            (internal/consensus.Intensity): "light" (PGA < 16.6 gal),
            "moderate" (< 137.2), "strong" (>= 137.2). Nilai yang sama muncul
            pada payload FCM/WebSocket. Klien yang memetakannya ke enum harus
            membandingkan tanpa memedulikan besar-kecil huruf.
          enum: [light, moderate, strong]
          example: strong
        latitude:
          type: number
          format: double
          description: ST_Y(estimated_centroid) — pusat massa stasiun pemicu, BUKAN episenter.
          example: -6.8721
        longitude:
          type: number
          format: double
          description: ST_X(estimated_centroid) — pusat massa stasiun pemicu, BUKAN episenter.
          example: 107.5422
        depth_km:
          type: [number, "null"]
          format: double
          description: >
            SELALU null. Jaringan MEMS permukaan ini mengestimasi centroid
            2D, bukan hiposenter — kedalaman tidak dapat diturunkan dari data
            yang ada. Field dipertahankan agar model klien stabil bila suatu
            bila sumber data eksternal diintegrasikan sebagai referensi pasca-kejadian.
          example: null
        location_name:
          type: string
          example: Cimahi, West Java, ID
        triggered_nodes_count:
          type: integer
          minimum: 3
          example: 4
        created_at:
          type: string
          format: date-time
          description: Dipetakan dari kolom started_at (awal kejadian). Basis pengurutan DESC.
          example: 2026-08-19T11:02:00Z
        resolved_at:
          type: [string, "null"]
          format: date-time
          description: >
            Absen dari payload (atau null) selama status masih HAPPENING.
          example: 2026-08-19T11:04:30Z
        event_state:
          type: string
          description: >
            State siklus hidup Fase 3 (§9.1). ABSEN pada baris pra-Fase-3, yang
            memang tidak pernah mencatatnya — absen berarti "tidak diketahui",
            bukan sebuah state bernama, jadi klien tidak boleh menganggap
            ketiadaannya sebagai CONFIRMED tanpa melihat status. status sendiri
            adalah proyeksi dua nilai dari state ini dan tetap menjadi field
            yang stabil untuk klien lama.
          enum: [CONFIRMED, RESOLVED, CANCELLED]
          example: RESOLVED
        event_revision:
          type: integer
          minimum: 1
          description: >
            Nomor revisi transisi TERAKHIR yang tercatat untuk event ini,
            naik satu tiap transisi. Monoton per event; tidak dapat
            dibandingkan antar-event. Absen pada baris pra-Fase-3.
          example: 3
        origin_ts:
          type: integer
          format: int64
          minimum: 1700000000000
          description: >
            Perkiraan waktu onset guncangan dalam ms epoch UTC — BUKAN
            created_at, yang menyatakan kapan barisnya lahir. Absen pada baris
            pra-Fase-3.
          example: 1755601320000
        origin_ts_source:
          type: string
          description: >
            Asal origin_ts. SENSOR = onset diukur node. PUBLISH_BOUND = onset
            hanya batas atas yang diturunkan dari waktu publish observasi
            legacy v1, jadi ia dapat lebih lambat dari guncangan sebenarnya.
            Absen pada baris pra-Fase-3.
          enum: [SENSOR, PUBLISH_BOUND]
          example: SENSOR
        independent_cell_count:
          type: integer
          minimum: 1
          description: >
            Jumlah kontributor event yang saling independen (§7.3).
            Dua kontributor independen bila jarak geodesik >= IndependenceCellKm
            (default 5 km). Selalu >= 2 untuk event di umpan ini, karena itu
            prasyarat CONFIRMED. Absen pada baris pra-Fase-3.
          example: 3

    LatencyStats:
      type: object
      description: >
        Ringkasan satu seri latensi tahap SERVER (P4-M3′). Hanya in-memory: tidak
        dipersistensi, jadi seluruh angka kembali nol setelah proses restart.
        observed adalah jumlah sampel KUMULATIF, sedangkan p50/p95 hanya berbicara
        tentang paling banyak 256 sampel TERAKHIR — keduanya dilaporkan bersama
        supaya sebuah persentil tidak dapat dibaca seolah mewakili seluruh riwayat.
        Ketika observed = 0, p50 dan p95 adalah 0 karena tidak ada yang diukur;
        itu BUKAN latensi nol.
      required: [observed, p50_ms, p95_ms]
      properties:
        observed:
          type: integer
          format: int64
          minimum: 0
          description: >
            Jumlah sampel yang pernah dicatat untuk seri ini sejak proses mulai.
            Sampel negatif — onset lebih baru daripada keputusan yang
            menjelaskannya, yaitu jam node mendahului jam server — DIBUANG dan
            tidak dihitung di sini, jadi selisih terhadap jumlah transisi yang
            terjadi adalah petunjuk masalah jam.
          example: 12
        p50_ms:
          type: integer
          format: int64
          minimum: 0
          description: >
            Persentil ke-50 dalam milidetik, metode nearest-rank: nilainya adalah
            salah satu pengamatan yang benar-benar terjadi, bukan interpolasi.
          example: 620
        p95_ms:
          type: integer
          format: int64
          minimum: 0
          description: >
            Persentil ke-95 dalam milidetik, metode nearest-rank. Pada jumlah
            sampel kecil p95 dapat sama dengan nilai maksimum — baca bersama
            observed.
          example: 1480
