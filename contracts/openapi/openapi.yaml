openapi: 3.1.0
info:
  title: QuakeAlert REST API
  version: 1.0.0
  description: >
    Kontrak REST resmi QuakeAlert (contract-first, ADR-0004). Base URL selalu HTTPS.
    Satuan kanonik: PGA=gal (cm/s^2), timestamp=ms epoch UTC (int64), jarak=km, RSSI=dBm.
    Semua endpoint memerlukan Bearer JWT (anonymous) KECUALI:
    `GET /healthz` (probe publik), `POST /api/v1/auth/anonymous`
    (publik — bootstrap identitas) dan `GET /api/v1/events`
    (auth opsional; bila token dikirim ia wajib valid).
    Empat endpoint berikut adalah permukaan integrasi resmi klien Android
    (alur first-launch → lokasi → push → riwayat); panduan integrasi ada di
    docs/CLIENT_SPEC.md: `POST /api/v1/auth/anonymous`,
    `PUT /api/v1/users/location`, `PUT /api/v1/users/fcm-token`,
    `GET /api/v1/events`. Endpoint lainnya dipakai firmware (provisioning) dan
    tooling web (sensors, reroll pseudonym).
servers:
  - url: https://api.quakealert.id
    description: Produksi
  - url: http://localhost:8080
    description: Dev lokal (docker-compose)

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Bootstrap identitas anonim (JWT HS256)
  - name: nodes
    description: Provisioning & manajemen sensor node
  - name: sensors
    description: Status & peta sensor
  - name: users
    description: Profil pengguna anonim
  - name: events
    description: Riwayat kejadian gempa terkonfirmasi
  - name: chat
    description: Kanal komunitas (global & regional), lihat docs/CHAT_DESIGN.md
  - name: ops
    description: Health probe & kanal realtime (WebSocket)

paths:
  /healthz:
    get:
      tags: [ops]
      summary: Health probe (publik, tanpa prefix versi)
      description: >
        Probe liveness untuk load balancer / k8s. Publik dan sengaja berada di
        luar /api/v1: kontraknya adalah "proses hidup", bukan versi API. Body
        adalah teks biasa `ok`, BUKAN JSON, sehingga probe tidak perlu parser.
      operationId: healthz
      security: []
      responses:
        '200':
          description: Proses hidup
          content:
            text/plain:
              schema:
                type: string
              example: ok

  /ws:
    get:
      tags: [ops]
      summary: Kanal realtime alert & chat (WebSocket upgrade)
      description: >
        Meng-upgrade koneksi ke WebSocket dan mengirim frame alert yang sama
        dengan payload FCM (contracts/fcm/alert_payload.json): EARTHQUAKE_ALERT,
        EARTHQUAKE_ADVISORY dan EVENT_RESOLVED. Jalur foreground; FCM menangani
        background. Server mengirim ping berkala dan menutup koneksi bila pong
        tidak diterima — klien wajib menjawab (OkHttp melakukannya sendiri).


        Auth memakai Bearer JWT yang sama, dikirim pada header handshake HTTP.
        Origin: hanya permintaan browser (yang mengirim header `Origin`) diperiksa
        terhadap WS_ALLOWED_ORIGINS; klien native tidak mengirim Origin dan
        diizinkan tanpa konfigurasi tambahan.


        Socket yang sama juga memfanout frame chat
        (`{"type":"CHAT_MESSAGE", ...}`, bentuknya sama dengan skema ChatMessage
        dengan `timestamp` ms-epoch menggantikan `created_at`), hanya untuk kanal
        yang menjadi keanggotaan koneksi — dibaca sekali saat handshake. Alert
        selalu diprioritaskan: bila buffer per-klien menipis, frame chat
        dilewati dan koneksi TIDAK ditutup, karena pesan chat yang hilang muncul
        kembali lewat GET /api/v1/chat/messages sedangkan peringatan yang hilang
        tidak punya jalan kembali. Frame yang DIKIRIM klien tetap diabaikan:
        pengiriman chat lewat REST.


        Didokumentasikan untuk kelengkapan — OpenAPI tidak memodelkan frame
        WebSocket, jadi skema pesan tetap di contracts/fcm/alert_payload.json.
      operationId: wsAlerts
      security:
        - bearerAuth: []
      parameters:
        - name: Upgrade
          in: header
          required: true
          schema:
            type: string
            const: websocket
      responses:
        '101':
          description: Switching Protocols — koneksi menjadi WebSocket
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            Origin browser tidak ada dalam WS_ALLOWED_ORIGINS. Tidak pernah
            terjadi pada klien tanpa header Origin.

  /api/v1/auth/anonymous:
    post:
      tags: [auth]
      summary: Terbitkan profil anonim + JWT (publik)
      description: >
        Membuat baris user_profiles baru (user_id UUID + pseudonym acak) dan
        menerbitkan JWT HS256 dengan klaim standar `sub`/`iat`/`exp`.
        Endpoint ini SATU-SATUNYA yang tidak memerlukan Bearer token — klien
        memanggilnya sekali saat first launch lalu menyimpan token secara lokal.
      operationId: authAnonymous
      x-client: true # dipakai klien Android saat first-launch (docs/CLIENT_SPEC.md)
      security: []
      responses:
        '201':
          description: Profil & token berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonymousAuthResponse'
        '429':
          description: >
            Rate limit per-IP: satu pembuatan profil anonim per 30 detik
            (internal/api: authWindow). IP adalah satu-satunya kunci yang
            tersedia pada endpoint publik tanpa identitas. Mudah tersentuh saat
            pengembangan — emulator, CI dan perangkat di belakang satu NAT
            berbagi IP — jadi klien harus menahan token yang sudah ada dan tidak
            memanggil ulang di setiap start.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: RATE_LIMITED
                message: terlalu banyak pendaftaran, coba lagi nanti
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/nodes/provision:
    post:
      tags: [nodes]
      summary: Inisiasi sensor baru (provisioning)
      description: >
        Membuat station_id baru dan provisioning_secret (ditampilkan HANYA sekali).
        Server menyimpan secret dalam bentuk terenkripsi AES-256-GCM (secret_key_enc + nonce).
      operationId: provisionNode
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionRequest'
      responses:
        '201':
          description: Node berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: >
            station_id yang dikirim sudah terdaftar (unique violation pada
            iot_nodes.station_id). Node yang sudah pernah di-provision harus
            memakai secret yang tersimpan di NVS-nya, bukan meminta yang baru.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: STATION_ALREADY_EXISTS
                message: station_id sudah terdaftar

  /api/v1/sensors:
    get:
      tags: [sensors]
      summary: Daftar sensor + status (peta, RSSI, ping)
      operationId: listSensors
      security:
        - bearerAuth: []
      parameters:
        - name: range_km
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 500
          description: Radius filter dari lokasi user (km).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users/pseudonym/reroll:
    post:
      tags: [users]
      summary: Reroll pseudonym (rate-limited 1x/60s per user)
      operationId: rerollPseudonym
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RerollResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Terlalu sering; coba lagi nanti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/users/location:
    put:
      tags: [users]
      summary: Perbarui lokasi terakhir user (PostGIS)
      description: >
        Menyimpan koordinat user ke user_profiles.last_location
        (GEOGRAPHY(Point,4326)) sebagai basis filter radius pada /sensors dan
        penargetan alert. location_name adalah label hasil reverse-geocode di
        sisi klien dan bersifat opsional. Tidak ada radius yang diterima dari
        klien: radius peringatan tetap 200 km dengan override intensitas untuk
        gempa parah (MMI >= VII atau PGA >= 250 gal), keputusan sistem dan bukan
        preferensi per user.
      operationId: updateUserLocation
      x-client: true # dipakai klien Android (docs/CLIENT_SPEC.md)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateLocationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users/fcm-token:
    put:
      tags: [users]
      summary: Daftarkan/perbarui FCM registration token
      description: >
        Menyimpan token Firebase Cloud Messaging perangkat agar alert
        life-safety tetap sampai saat aplikasi berada di background.
      operationId: updateUserFCMToken
      x-client: true # dipakai klien Android (docs/CLIENT_SPEC.md)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFCMTokenRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateFCMTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/chat/channels:
    get:
      tags: [chat]
      summary: Kanal chat yang boleh diakses pemanggil
      description: >
        Server yang menjawab kanal mana yang menjadi keanggotaan user, bukan
        klien yang menebak kuncinya: kanal regional adalah turunan region_code
        yang tersimpan dari PUT /users/location, dan klien yang menyusun kunci
        sendiri akan meminta ruang yang tidak ada begitu normalisasi di server
        berubah. Kanal `global` selalu ada dan merupakan satu-satunya kanal yang
        berfungsi sebelum user pernah menyinkronkan posisi.
      operationId: listChatChannels
      x-client: true # dipakai klien Android (docs/CLIENT_SPEC.md)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatChannelsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/chat/messages:
    get:
      tags: [chat]
      summary: Riwayat pesan satu kanal (terbaru lebih dulu)
      description: >
        Paginasi memakai kursor waktu `before`, BUKAN offset: ruang yang aktif
        menggeser offset di antara dua permintaan, sehingga halaman berikutnya
        akan melewatkan atau menggandakan baris tepat saat percakapan ramai.
        Untuk memuat halaman berikutnya, kirim created_at pesan tertua yang sudah
        diterima. Pesan lebih lama dari 7 hari dihapus oleh retensi.
      operationId: listChatMessages
      x-client: true # dipakai klien Android (docs/CLIENT_SPEC.md)
      security:
        - bearerAuth: []
      parameters:
        - name: channel_id
          in: query
          required: false
          schema:
            type: string
            maxLength: 50
            default: global
          description: Default `global` bila tidak dikirim.
          example: ID-jawa-barat
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
          description: Nilai di atas 100 dibatasi ke 100, bukan ditolak.
        - name: before
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Kursor eksklusif; hanya pesan dengan created_at lebih awal.
          example: '2026-06-20T00:19:18Z'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessagesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Kanal bukan keanggotaan user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [chat]
      summary: Kirim satu pesan ke kanal
      description: >
        Pengiriman lewat REST, bukan lewat WebSocket: REST bersifat durable dan
        bisa diulang, sedangkan socket hanya memfanout apa yang sudah tersimpan,
        sehingga kegagalan siaran tidak pernah menghilangkan pesan. Sertakan
        client_message_id agar pengiriman idempoten - klien yang timeout tidak
        tahu apakah percobaan pertamanya sampai, dan pesan ganda di ruang publik
        tidak bisa ditarik kembali. Batas laju 1 pesan / 2 detik per user.
      operationId: createChatMessage
      x-client: true # dipakai klien Android (docs/CLIENT_SPEC.md)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatMessageRequest'
      responses:
        '201':
          description: >
            Tersimpan. Pengiriman ulang dengan client_message_id yang sama
            mengembalikan baris yang SAMA, bukan galat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Kanal bukan keanggotaan user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Melewati batas laju kirim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/events:
    get:
      tags: [events]
      summary: Riwayat kejadian gempa terkonfirmasi
      description: >
        Mengembalikan event terurut `created_at DESC` (terbaru dulu).
        Autentikasi opsional: tanpa Bearer token endpoint tetap melayani
        (data gempa bersifat publik), namun bila header Authorization dikirim
        token WAJIB valid — token kedaluwarsa/rusak ditolak 401, bukan
        diperlakukan sebagai anonim.
        Filter spasial aktif hanya bila `latitude`, `longitude`, dan `range_km`
        dikirim bersamaan (ST_DWithin pada estimated_centroid).
        Tiga filter tambahan bersifat independen dan boleh digabung:
        `min_pga` (ambang intensitas), `since` dan `until` (rentang waktu
        `started_at`). Semuanya dievaluasi di SQL, bukan di klien, agar
        paginasi tetap mengembalikan halaman penuh — menyaring hasil setelah
        `limit` akan membuat halaman pendek dan merusak deteksi akhir data
        pada infinite scroll klien.
      operationId: listEvents
      x-client: true # dipakai klien Android (docs/CLIENT_SPEC.md)
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Jumlah maksimum event yang dikembalikan.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 50000
          description: >
            Offset paginasi. Dibatasi 50000 (internal/api: maxEventsOffset) agar
            offset liar tidak memicu scan O(offset) pada indeks started_at DESC;
            nilai di luar rentang ditolak 400 INVALID_ARGUMENT, bukan di-clamp.
        - name: range_km
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 2000
          description: >
            Radius filter dari (latitude, longitude). Wajib disertai kedua
            koordinat; bila salah satu absen server menolak 400.
        - name: latitude
          in: query
          required: false
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          description: Latitude acuan filter radius.
        - name: longitude
          in: query
          required: false
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          description: Longitude acuan filter radius.
        - name: min_pga
          in: query
          required: false
          schema:
            type: number
            format: double
            minimum: 0
            maximum: 2000
          description: >
            Ambang bawah intensitas dalam PGA (gal): hanya event dengan
            `max_pga >= min_pga` dikembalikan. Ambang dikirim dalam gal — bukan
            MMI — karena `earthquake_events.mmi_scale` adalah angka Romawi
            (VARCHAR) sementara `max_pga` NUMERIC dapat dibandingkan langsung
            tanpa kolom turunan baru. Klien memetakan pilihan MMI ke gal memakai
            tabel ambang SYSTEM_SPEC Bab 5.3 yang sama dengan
            server/internal/consensus (Intensity/MMIFromPGA), sehingga label UI
            tetap berbicara MMI.
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: >
            Batas bawah rentang waktu (inklusif) pada `started_at`, RFC3339.
            Ditolak 400 bila tidak dapat diparse, atau bila lebih besar dari
            `until`.
        - name: until
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: >
            Batas atas rentang waktu (inklusif) pada `started_at`, RFC3339.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Request tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: JWT tidak ada / tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Kesalahan internal server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >
            Kode mesin yang stabil. Nilai yang dipakai server:
            INVALID_ARGUMENT, UNAUTHENTICATED, STATION_ALREADY_EXISTS,
            RATE_LIMITED, INTERNAL.
          enum:
            - INVALID_ARGUMENT
            - UNAUTHENTICATED
            - STATION_ALREADY_EXISTS
            - RATE_LIMITED
            - INTERNAL
          example: INVALID_ARGUMENT
        message:
          type: string
          example: latitude di luar rentang -90..90

    AnonymousAuthResponse:
      type: object
      required: [token, token_type, expires_at, user_id, pseudonym, created_at]
      properties:
        token:
          type: string
          description: JWT HS256 dengan klaim `sub` (=user_id), `iat`, `exp`.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIzYTc4...
        token_type:
          type: string
          enum: [Bearer]
          example: Bearer
        expires_at:
          type: string
          format: date-time
          description: Waktu kedaluwarsa token (RFC3339 UTC), sama dengan klaim `exp`.
          example: 2026-09-18T11:02:00Z
        user_id:
          type: string
          format: uuid
          example: 3a78f1c2-9d4e-4b0a-8f77-2c1b5e9a6d30
        pseudonym:
          type: string
          maxLength: 32
          example: Quakezen-7B9A
        created_at:
          type: string
          format: date-time
          example: 2026-08-19T11:02:00Z

    ProvisionRequest:
      type: object
      additionalProperties: false
      required: [sensor_model, location_name, latitude, longitude]
      properties:
        station_id:
          type: string
          description: >-
            Opsional. Station ID yang sudah di-generate node (disimpan di NVS)
            agar ID di firmware & DB identik. Bila diisi, server memakai nilai
            ini; bila kosong/absen, server men-generate sendiri lalu
            mengembalikannya di ProvisionResponse.
          pattern: '^NODE-[0-9A-F]{8}$'
          example: NODE-163A149F
        sensor_model:
          type: string
          example: MPU 6050
        location_name:
          type: string
          maxLength: 150
          example: Cimahi, West Java, ID
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: -6.8721
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 107.5422

    ProvisionResponse:
      type: object
      required: [station_id, provisioning_secret, mqtt_broker, mqtt_port, mqtt_tls]
      properties:
        station_id:
          type: string
          example: NODE-163A149F
        provisioning_secret:
          type: string
          description: One-time secret; TIDAK pernah dikembalikan lagi.
          example: sec_key_991823719283719
        mqtt_broker:
          type: string
          example: broker.quakealert.id
        mqtt_port:
          type: integer
          example: 8883
        mqtt_tls:
          type: boolean
          example: true

    SensorsResponse:
      type: object
      required: [range_km, active_sensors_count, stations]
      properties:
        range_km:
          type: integer
          example: 50
        active_sensors_count:
          type: integer
          example: 2
        stations:
          type: array
          items:
            $ref: '#/components/schemas/Station'

    Station:
      type: object
      required: [station_id, sensor_model, location_name, latitude, longitude, status]
      properties:
        station_id:
          type: string
          example: NODE-163A149F
        sensor_model:
          type: string
          example: MPU 6050
        location_name:
          type: string
          example: Cimahi, West Java, ID
        latitude:
          type: number
          format: double
          example: -6.8721
        longitude:
          type: number
          format: double
          example: 107.5422
        status:
          type: string
          enum: [Online, Offline]
          example: Online
        last_ping:
          type: string
          description: Human-readable relative time.
          example: 33s ago
        rssi_dbm:
          type: integer
          example: -61
        latency_ms:
          type: integer
          example: 2

    RerollResponse:
      type: object
      required: [pseudonym, updated_at]
      properties:
        pseudonym:
          type: string
          example: Quakezen-7B9A
        region_code:
          type: [string, "null"]
          maxLength: 50
          description: >
            Kanal chat regional yang berlaku setelah pembaruan ini, atau null
            bila wilayahnya tidak dapat dinormalisasi (mis. nama non-ASCII) atau
            tidak dapat dibaca. Dalam kasus itu user hanya punya kanal global.
            Bila wilayah tidak dikirim, ini adalah kanal yang sudah tersimpan.
          example: ID-jawa-barat
        updated_at:
          type: string
          format: date-time
          example: 2026-08-17T18:30:00Z

    ChatChannel:
      type: object
      required: [channel_id, kind, display_name]
      properties:
        channel_id:
          type: string
          maxLength: 50
          description: >
            `global`, atau kunci regional `<ISO2>-<slug-admin1>`. Kunci ini
            disusun server dari wilayah yang dikirim ke PUT /users/location.
          example: ID-jawa-barat
        kind:
          type: string
          enum: [GLOBAL, REGIONAL]
          example: REGIONAL
        display_name:
          type: string
          maxLength: 80
          description: >
            Judul kanal milik penulis pertama, bukan ejaan ponsel pemanggil,
            sehingga setiap anggota melihat satu judul yang sama.
          example: Jawa Barat

    ChatChannelsResponse:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          description: Kanal global selalu berada di indeks pertama.
          items:
            $ref: '#/components/schemas/ChatChannel'

    ChatMessage:
      type: object
      required: [message_id, channel_id, sender_id, sender_pseudonym, message, is_admin, created_at]
      properties:
        message_id:
          type: string
          format: uuid
          example: 8f14e45f-ceea-467a-9c3f-2b0c4d5e6f70
        channel_id:
          type: string
          maxLength: 50
          example: ID-jawa-barat
        sender_id:
          type: string
          description: >
            UUID pengirim, atau string kosong bila profilnya sudah dihapus
            (FK ON DELETE SET NULL). Klien memakainya untuk mengenali pesannya
            sendiri.
          example: 3a78f1c2-9d4e-4b0a-8f77-2c1b5e9a6d30
        sender_pseudonym:
          type: string
          maxLength: 32
          description: >
            SNAPSHOT saat pesan dikirim, bukan hasil join: pseudonym dapat
            di-reroll, dan riwayat tidak boleh berganti nama secara retroaktif.
          example: AnonimTenang
        sender_location_tag:
          type: string
          maxLength: 50
          description: Opsional. Label lokasi pengirim saat pesan dikirim.
          example: Bandung
        message:
          type: string
          maxLength: 500
          example: Aman di sini, hanya lampu bergoyang.
        is_admin:
          type: boolean
          description: >
            Belum dipakai: tidak ada jalur admin yang dibangun (lihat
            docs/CHAT_DESIGN.md bagian 7). Selalu false untuk saat ini.
          example: false
        created_at:
          type: string
          format: date-time
          example: '2026-06-20T00:19:18Z'

    ChatMessagesResponse:
      type: object
      required: [channel_id, limit, count, messages]
      properties:
        channel_id:
          type: string
          example: ID-jawa-barat
        limit:
          type: integer
          example: 30
        count:
          type: integer
          description: >
            Jumlah pesan pada halaman ini. count < limit berarti tidak ada
            halaman lebih lama lagi.
          example: 30
        messages:
          type: array
          description: Urutan menurun berdasarkan created_at (terbaru lebih dulu).
          items:
            $ref: '#/components/schemas/ChatMessage'

    CreateChatMessageRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        channel_id:
          type: string
          maxLength: 50
          default: global
          description: Default `global` bila tidak dikirim.
          example: ID-jawa-barat
        message:
          type: string
          minLength: 1
          maxLength: 500
          description: >
            Dihitung dalam karakter (rune), bukan byte: batas berbasis byte akan
            memotong teks non-Latin jauh lebih pendek daripada 500 karakter yang
            dijanjikan ke user. Spasi di tepi dipangkas server; body yang hanya
            berisi spasi ditolak 400.
          example: Aman di sini, hanya lampu bergoyang.
        client_message_id:
          type: string
          format: uuid
          description: >
            Opsional tapi sangat disarankan. Kunci idempotensi: pengiriman ulang
            dengan nilai yang sama mengembalikan pesan yang sama alih-alih
            membuat duplikat.
          example: 5c2d1e90-3b7a-4f61-8e0d-9a4b7c6d5e1f

    UpdateLocationRequest:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: -6.8721
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 107.5422
        location_name:
          type: string
          maxLength: 150
          description: >
            Opsional. Label hasil reverse-geocode di sisi klien. Karena
            endpoint ini bersemantik PUT (replace), mengirim body tanpa
            location_name akan MENGOSONGKAN label yang tersimpan sebelumnya.
          example: Cimahi, West Java, ID
        country_iso:
          type: string
          minLength: 2
          maxLength: 2
          description: >
            Opsional. Kode negara ISO-3166 alpha-2 dari reverse-geocode klien.
            Bersama admin_area, server menurunkannya menjadi kunci kanal chat
            regional. Dinormalisasi di server: ejaan yang berbeda untuk provinsi
            yang sama harus mendarat di satu kanal. Bila country_iso dan
            admin_area sama-sama absen, region yang tersimpan DIBIARKAN — bukan
            dikosongkan.
          example: ID
        admin_area:
          type: string
          maxLength: 100
          description: >
            Opsional. Nama wilayah administratif tingkat 1 (provinsi/negara
            bagian). Granularitas ini disengaja: cukup kasar sehingga keanggotaan
            kanal bukan pengungkapan lokasi, cukup spesifik sehingga "gempa di
            dekat saya" masih relevan.
          example: Jawa Barat

    UpdateLocationResponse:
      type: object
      required: [user_id, latitude, longitude, updated_at]
      properties:
        user_id:
          type: string
          format: uuid
          example: 3a78f1c2-9d4e-4b0a-8f77-2c1b5e9a6d30
        latitude:
          type: number
          format: double
          example: -6.8721
        longitude:
          type: number
          format: double
          example: 107.5422
        location_name:
          type: [string, "null"]
          maxLength: 150
          description: null bila user belum/tidak mengirim label lokasi.
          example: Cimahi, West Java, ID
        updated_at:
          type: string
          format: date-time
          example: 2026-08-19T11:02:00Z

    UpdateFCMTokenRequest:
      type: object
      additionalProperties: false
      required: [fcm_token]
      properties:
        fcm_token:
          type: string
          minLength: 1
          maxLength: 255
          example: fMEP0vJq...:APA91bH-Xy9
    UpdateFCMTokenResponse:
      type: object
      required: [updated_at]
      properties:
        updated_at:
          type: string
          format: date-time
          example: 2026-08-19T11:02:00Z

    EventsResponse:
      type: object
      required: [limit, offset, count, events]
      properties:
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
        count:
          type: integer
          description: Jumlah event pada halaman ini (bukan total keseluruhan).
          example: 1
        range_km:
          type: [integer, "null"]
          description: Radius yang dipakai bila filter spasial aktif; null bila tidak.
          example: 300
        events:
          type: array
          items:
            $ref: '#/components/schemas/EarthquakeEvent'

    EarthquakeEvent:
      type: object
      description: >
        Satu baris earthquake_events. Hanya event CONFIRMED (>= 3 node unik)
        dipersistensikan, jadi seluruh isi endpoint ini sudah terkonfirmasi
        konsensus — ADVISORY (1-2 node) tidak pernah muncul di sini.
      required:
        [event_id, status, pga, mmi, intensity_label, latitude, longitude,
         location_name, triggered_nodes_count, created_at]
      properties:
        event_id:
          type: string
          format: uuid
          example: a3f1c9de-51b2-4c77-9a0e-8d6f3b2c1a04
        status:
          type: string
          enum: [HAPPENING, RESOLVED]
          example: RESOLVED
        pga:
          type: number
          format: double
          description: max_pga dalam gal (cm/s^2) — satuan kanonik, konversi ke g hanya untuk tampilan.
          example: 413.13
        mmi:
          type: string
          description: mmi_scale (angka Romawi).
          example: V
        intensity_label:
          type: string
          description: >
            Label intensitas yang diemisi konsensus, HURUF KECIL
            (internal/consensus.Intensity): "light" (PGA < 16.6 gal),
            "moderate" (< 137.2), "strong" (>= 137.2). Nilai yang sama muncul
            pada payload FCM/WebSocket. Klien yang memetakannya ke enum harus
            membandingkan tanpa memedulikan besar-kecil huruf.
          enum: [light, moderate, strong]
          example: strong
        latitude:
          type: number
          format: double
          description: ST_Y(estimated_centroid) — pusat massa stasiun pemicu, BUKAN episenter.
          example: -6.8721
        longitude:
          type: number
          format: double
          description: ST_X(estimated_centroid) — pusat massa stasiun pemicu, BUKAN episenter.
          example: 107.5422
        depth_km:
          type: [number, "null"]
          format: double
          description: >
            SELALU null. Jaringan MEMS permukaan ini mengestimasi centroid
            2D, bukan hiposenter — kedalaman tidak dapat diturunkan dari data
            yang ada. Field dipertahankan agar model klien stabil bila suatu
            saat sumber katalog (mis. BMKG) diintegrasikan.
          example: null
        location_name:
          type: string
          example: Cimahi, West Java, ID
        triggered_nodes_count:
          type: integer
          minimum: 3
          example: 4
        created_at:
          type: string
          format: date-time
          description: Dipetakan dari kolom started_at (awal kejadian). Basis pengurutan DESC.
          example: 2026-08-19T11:02:00Z
        resolved_at:
          type: [string, "null"]
          format: date-time
          description: >
            Absen dari payload (atau null) selama status masih HAPPENING.
          example: 2026-08-19T11:04:30Z
